# yaml-language-server: $schema=https://raw.githubusercontent.com/KernelSU-Modules/tools/main/schemas/module.schema.json
schemaVersion: 1
id: magic_v2ray
name: Magic V2Ray
summary: System-level transparent proxy for rooted Android, built on Xray-core, with a full management app. Tap Action after installing to get the app.
description: docs/README.md
license: GPL-3.0-or-later
homepage: https://github.com/vincentng295/Magic_V2Ray
support: https://github.com/vincentng295/Magic_V2Ray/issues
tags: [proxy, vpn, network, xray, tproxy]
icon: app/src/main/res/drawable-nodpi/module_icon.png
metamodule: false

authors:
  - name: HuskyDG
  - name: vincentng295
    url: https://github.com/vincentng295

compatibility:
  androidMinApi: 26
  architectures: [arm64-v8a, x86_64]

release:
  # The release holds the three APKs plus exactly one .zip: the installer stub.
  assetPattern: "magic_v2ray-*-stub.zip"
