name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck dash

      # Android runs these under busybox ash / mksh. Parsing them with dash
      # catches bashisms that ash would tolerate on some devices and reject on
      # others — the class of bug that only shows up on one user's ROM.
      - name: POSIX parse check (dash)
        run: |
          for f in service.sh proxy_control.sh uninstall.sh customize.sh action.sh; do
            echo "== $f"
            dash -n "$f"
          done

      - name: shellcheck
        run: |
          shellcheck --shell=dash --severity=warning \
            service.sh proxy_control.sh uninstall.sh action.sh
          # customize.sh is sourced by the root manager, which predefines
          # ui_print/abort/set_perm* and $MODPATH/$ZIPFILE/$ARCH.
          shellcheck --shell=dash --severity=warning \
            --exclude=SC2154 \
            -e SC2148 customize.sh

  native:
    name: Native (xhuskydg_helper)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Host build of the exact sources the NDK build compiles: service/*.c with
      # the C driver, applets with C++, linked together. Catches compile errors
      # and C/C++ symbol clashes before the (slower) Android build job.
      - name: Host compile + link
        run: |
          set -e
          mkdir -p /tmp/o
          for f in native/jni/service/*.c; do
            gcc -std=gnu11 -D_GNU_SOURCE -Wall -Wextra -Wno-override-init \
              -DMV_XTABLES_LOCK='"/system/etc/xtables.lock"' \
              -c "$f" -o "/tmp/o/$(basename "${f%.c}").o"
          done
          for f in native/jni/*.cpp; do
            g++ -std=c++17 -Wall -c "$f" -o "/tmp/o/$(basename "${f%.cpp}").o"
          done
          g++ /tmp/o/*.o -o /tmp/xhuskydg_helper -lpthread
          # no args / bad flag must print usage and not touch the system
          /tmp/xhuskydg_helper service -x 2>&1 | grep -q 'usage: xhuskydg_helper service'

      # iptables engine against a fake kernel (ASan + UBSan).
      - name: iptables engine tests
        run: sh native/tests/run_host_tests.sh

  webui:
    name: Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check
        run: |
          for f in app/src/main/assets/webroot/*.js; do
            echo "== $f"
            node --check "$f"
          done

      # Kept as a standalone file (rather than an inline `node -e '...'`) so
      # the exact script CI runs can also be run locally: `node
      # .github/scripts/check-i18n.js`. An earlier inline version had to dodge
      # the outer single-quoted shell string by using `.` in place of a real
      # quote character in its key-matching regex, which over-matched and
      # produced false "missing key" failures.
      - name: i18n completeness
        run: node .github/scripts/check-i18n.js

      # The root exec bridge runs whatever string these files build, so a
      # regression that puts untrusted text back into a command is a root RCE.
      # Fail the build if the unsafe patterns come back.
      - name: Guard against shell injection regressions
        run: |
          set -e
          fail=0
          if grep -nE "execShell\(\`[^\`]*\\\$\{(xrayConfig|config_json|newUri|rawUri|url|category|escapedUrl)\}" app/src/main/assets/webroot/*.js; then
            echo "::error::untrusted value interpolated into a shell command"
            fail=1
          fi
          if grep -nE "^\s*execShell\(\`echo '" app/src/main/assets/webroot/*.js; then
            echo "::error::use writeFileB64() instead of echo '...' > file"
            fail=1
          fi
          # Match calls/definitions, not prose that mentions the old helper.
          if grep -nE "escapeAttr[[:space:]]*\(" app/src/main/assets/webroot/*.js | grep -vE ":[[:space:]]*(//|\*)"; then
            echo "::error::escapeAttr was removed; do not build event handlers as strings"
            fail=1
          fi
          if grep -nE "curl[^\"'\`]*[[:space:]]-[a-zA-Z]*k" app/src/main/assets/webroot/*.js | grep -v "allowInsecure"; then
            echo "::error::unconditional 'curl -k' reintroduced"
            fail=1
          fi
          exit $fail

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # These run the real service.sh / proxy_control.sh logic under /bin/sh
      # (dash on ubuntu-latest, same POSIX subset Android's ash/mksh accept)
      # against fixtures, so nothing touches iptables or a device.
      - name: Run unit tests
        run: python3 -m unittest discover -s .github/tests -v

  manifest:
    name: Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # customize.sh is the complete file manifest (SKIPUNZIP=1). Anything it
      # forgets is simply absent at runtime — this is exactly how uninstall.sh
      # went missing and left user credentials on disk after removal.
      - name: Every extracted path exists in the repo
        run: |
          set -e
          fail=0
          for f in $(grep -oE '"[a-zA-Z0-9_./*-]+"' customize.sh \
                     | tr -d '"' | grep -E '^(bin|[a-z_]+\.sh|module\.prop)' \
                     | sed 's|/\*$||' | sort -u); do
            if [ ! -e "$f" ]; then echo "::error::customize.sh extracts '$f' which is not in the repo"; fail=1; fi
          done
          exit $fail

      - name: Required files are in the manifest
        run: |
          set -e
          fail=0
          for f in service.sh proxy_control.sh uninstall.sh action.sh module.prop; do
            grep -q "\"$f\"" customize.sh || { echo "::error::$f is never extracted by customize.sh"; fail=1; }
          done
          exit $fail

      - name: updateJson must be https
        run: |
          grep -q '^updateJson=https://' module.prop \
            || { echo "::error::updateJson must use https"; exit 1; }

  build:
    name: Build & Upload APKs
    runs-on: ubuntu-latest
    needs: [shell, native, webui, python-tests, manifest]
    steps:
      - uses: actions/checkout@v4

      # build.sh needs bash, curl and unzip (fetching xray, verifying the APKs).
      # All ship on ubuntu-latest; installed explicitly so a runner image
      # change can't silently break the build.
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y unzip curl bash

      # build.sh compiles native/ with the Android NDK. GitHub's ubuntu image
      # ships one and exports ANDROID_NDK_HOME; fail early if that ever changes.
      - name: Check Android NDK
        run: |
          ndk="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          [ -d "$ndk/toolchains/llvm/prebuilt" ] || { echo "::error::Android NDK not found on runner"; exit 1; }
          echo "NDK: $ndk"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      # Prerelease builds get "x-alpha-build-<8-char commit hash> & Xray-core@vX"
      # so the APK filename and the module.prop shipped inside it identify the
      # exact commit. The Xray-core part is kept from module.prop (build.sh
      # parses it to decide which xray binary to download). Stable builds
      # keep module.prop's version untouched.
      - name: Stamp prerelease version (alpha only)
        if: github.ref == 'refs/heads/alpha'
        run: |
          set -e
          xray=$(sed -n 's/^version=.*\(Xray-core@v[0-9.]*\).*/\1/p' module.prop | head -n 1)
          [ -n "$xray" ] || { echo "::error::could not parse Xray-core version from module.prop"; exit 1; }
          # "\&" because a bare & in a sed replacement means "the matched text"
          sed -i "s|^version=.*|version=x-alpha-build-${GITHUB_SHA::8} \& ${xray}|" module.prop
          grep '^version=' module.prop

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # setup-gradle caches ~/.gradle (dependencies, wrapper, build cache).
      # By default only the default branch writes the cache; main and alpha
      # both write it here, PRs and other branches only read it.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/alpha' }}

      # build.sh already skips the xray download and the helper build when the
      # binaries in bin/<arch>/ match their .version stamps, so restoring those
      # files is all that is needed. The key uses the Xray-core version and the
      # native/ sources, not module.prop as a whole: alpha builds stamp the
      # version= line with the commit hash, which would change the key every run.
      - name: Get Xray-core version
        id: xrayver
        run: |
          v=$(sed -n 's/^version=.*Xray-core@\(v[0-9.]*\).*/\1/p' module.prop | head -n 1)
          [ -n "$v" ] || { echo "::error::could not parse Xray-core version from module.prop"; exit 1; }
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - name: Cache xray + helper binaries
        uses: actions/cache@v4
        with:
          path: |
            bin/*/xray
            bin/*/xray.version
            bin/*/xhuskydg_helper
            bin/*/xhuskydg_helper.version
          key: bins-${{ steps.xrayver.outputs.v }}-${{ hashFiles('native/**') }}
          restore-keys: |
            bins-${{ steps.xrayver.outputs.v }}-

      # GitHub secrets only hold text, so the keystore is stored base64-encoded
      # in MV_KEYSTORE_BASE64 and decoded to a temp file for build.sh.
      - name: Decode keystore
        env:
          MV_KEYSTORE_BASE64: ${{ secrets.MV_KEYSTORE_BASE64 }}
        run: |
          set -e
          [ -n "$MV_KEYSTORE_BASE64" ] || { echo "::error::secret MV_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$MV_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # APKs only (build.sh checks each one doubles as a flashable module zip).
      - name: Run release packager
        env:
          MV_KEYSTORE: ${{ runner.temp }}/release.jks
          MV_KEYSTORE_PASSWORD: ${{ secrets.MV_KEYSTORE_PASSWORD }}
          MV_KEY_ALIAS: ${{ secrets.MV_KEY_ALIAS }}
          MV_KEY_PASSWORD: ${{ secrets.MV_KEY_PASSWORD }}
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload arm64-v8a artifact
        uses: actions/upload-artifact@v4
        with:
          name: magic_v2ray-arm64-v8a
          path: dist/*-arm64-v8a.apk
          if-no-files-found: error

      - name: Upload x86_64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: magic_v2ray-x86_64
          path: dist/*-x86_64.apk
          if-no-files-found: error

      - name: Upload universal artifact
        uses: actions/upload-artifact@v4
        with:
          name: magic_v2ray-universal
          path: dist/*-universal.apk
          if-no-files-found: error

  release:
      name: Publish Release
      runs-on: ubuntu-latest
      needs: [build]
      if: |
        github.ref == 'refs/heads/main' &&
        contains(github.event.head_commit.message, '[release]')
      permissions:
        contents: write
      steps:
        - uses: actions/checkout@v4

        - name: Download all APKs
          uses: actions/download-artifact@v4
          with:
            path: dist
            pattern: magic_v2ray-*
            merge-multiple: true

        # An APK is also a module zip. Publish a .zip copy next to each APK so
        # the root manager / update.json can flash it without renaming.
        - name: Add flashable .zip copies
          run: |
            set -e
            for f in dist/*.apk; do
              cp -f "$f" "${f%.apk}.zip"
            done
            ls -la dist

        - name: Derive tag and release name from module.prop
          id: ver
          run: |
            set -e
            version_line=$(grep -E '^version=' module.prop | cut -d= -f2-)
            # "v1.x & Xray-core@v26.7.11" -> tag "v1.x"
            tag=$(echo "$version_line" | sed -E 's/^([^ ]+).*/\1/')
            if [ -z "$tag" ]; then
              echo "::error::could not parse tag from module.prop version= line"
              exit 1
            fi
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "release_name=$version_line" >> "$GITHUB_OUTPUT"

        - name: Create GitHub Release
          uses: softprops/action-gh-release@v2
          with:
            tag_name: ${{ steps.ver.outputs.tag }}
            name: ${{ steps.ver.outputs.release_name }}
            body_path: CHANGELOG.md
            fail_on_unmatched_files: true
            files: |
              dist/*.apk

  release_alpha:
      name: Publish Alpha Pre-release
      runs-on: ubuntu-latest
      needs: [build]
      if: github.ref == 'refs/heads/alpha'
      permissions:
        contents: write
      steps:
        - uses: actions/checkout@v4
          with:
            # Full history (all branches) needed for `git log main...alpha`
            # below — a shallow clone wouldn't contain main's commits.
            fetch-depth: 0

        - name: Download all APKs
          uses: actions/download-artifact@v4
          with:
            path: dist
            pattern: magic_v2ray-*
            merge-multiple: true

        # An APK is also a module zip. Publish a .zip copy next to each APK so
        # the root manager can flash it without renaming.
        - name: Add flashable .zip copies
          run: |
            set -e
            for f in dist/*.apk; do
              cp -f "$f" "${f%.apk}.zip"
            done
            ls -la dist

        - name: Derive prerelease name
          id: ver
          run: |
            set -e
            xray=$(sed -n 's/^version=.*\(Xray-core@v[0-9.]*\).*/\1/p' module.prop | head -n 1)
            [ -n "$xray" ] || { echo "::error::could not parse Xray-core version from module.prop"; exit 1; }
            echo "release_name=x-alpha-build-${GITHUB_SHA::8} & ${xray}" >> "$GITHUB_OUTPUT"

        # tag_name is fixed, so every push to alpha lands on the same
        # "x-alpha-pre-release" tag/release instead of piling up new ones.
        - name: Build release notes from main...alpha
          id: log
          run: |
            set -e
            git fetch origin main --quiet
            {
              echo "notes<<GH_EOF"
              echo "Changes on \`alpha\` since it diverged from \`main\`:"
              echo
              git log --pretty=format:'- %s (%h)' origin/main...origin/alpha
              echo
              echo "GH_EOF"
            } >> "$GITHUB_OUTPUT"

        # The tag must be deleted (not just the release) or it keeps
        # pointing at the old commit and the "release" ends up detached
        # from what was actually just built.
        - name: Delete previous x-alpha-pre-release
          env:
            GH_TOKEN: ${{ github.token }}
          run: gh release delete x-alpha-pre-release --yes --cleanup-tag || true

        - name: Create/overwrite alpha pre-release
          uses: softprops/action-gh-release@v2
          with:
            tag_name: x-alpha-pre-release
            name: ${{ steps.ver.outputs.release_name }}
            target_commitish: ${{ github.sha }}
            body: ${{ steps.log.outputs.notes }}
            prerelease: true
            fail_on_unmatched_files: true
            files: |
              dist/*.apk